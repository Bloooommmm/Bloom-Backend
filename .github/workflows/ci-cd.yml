name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  deploy:
    name: Deploy to Coolify
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Coolify deployment
        if: ${{ secrets.COOLIFY_WEBHOOK_URL != '' }}
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: curl --fail --show-error --silent --retry 3 --retry-all-errors --request GET "$COOLIFY_WEBHOOK_URL"
      - name: Require Coolify webhook secret
        if: ${{ secrets.COOLIFY_WEBHOOK_URL == '' }}
        run: |
          echo "Repository secret COOLIFY_WEBHOOK_URL is not configured."
          exit 1
